<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GroundTwin Globe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='10' fill='%234fd1e8'/%3E%3Ccircle cx='20' cy='16' r='10' fill='none' stroke='%23e8edf5' stroke-width='2.5'/%3E%3C/svg%3E">
<!-- Code written with assistance from Claude (Anthropic) for GroundTwin, NASA Space Apps 2026. -->
<!-- Standalone page (embeddable via iframe / Framer Embed). Imagery: NASA GIBS. No Cesium ion, no API keys. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css">
<style>
  :root { --bg:#0a0e16; --surface:#111827; --line:#243049; --text:#e8edf5; --muted:#93a0b5; --moon:#4fd1e8; --mars:#e0735a; --ref:#f0a35e; --ours:#6fcf97; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 Inter, system-ui, sans-serif; }
  #globe { position:absolute; inset:0; }
  .panel { position:absolute; z-index:2; background:rgba(17,24,39,.94); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  #head { top:calc(10px + env(safe-area-inset-top, 0px)); left:10px; max-width:min(330px, calc(100vw - 20px)); }
  #head h1 { font-size:16px; margin:0 0 4px; }
  #head p { margin:0 0 8px; color:var(--muted); font-size:12px; }
  #head label { display:flex; align-items:center; gap:7px; font-size:13px; margin:3px 0; cursor:pointer; }
  #head i { width:11px; height:11px; border-radius:50%; display:inline-block; }
  #head a { color:var(--moon); font-size:12px; }
  #info { bottom:calc(30px + env(safe-area-inset-bottom, 0px)); right:10px; width:min(360px, calc(100vw - 20px)); max-height:60vh; overflow-y:auto; }
  #info h2 { font-size:15px; margin:0 0 2px; }
  #info .grp { font-size:12px; color:var(--muted); }
  #info .nums { margin:8px 0; font-size:13px; }
  #info .nums b { color:var(--moon); }
  #info p { margin:6px 0; font-size:12.5px; color:#c3cddc; }
  .ai { font-size:11px; padding:1px 7px; border-radius:999px; background:rgba(240,163,94,.15); color:var(--ref); }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .btns a { text-decoration:none; font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:8px; background:#172033; color:var(--text); border:1px solid var(--line); }
  .btns a:hover { border-color:var(--moon); }
  #close { position:absolute; top:6px; right:9px; background:none; border:0; color:var(--muted); font-size:18px; cursor:pointer; }
  #msg { top:50%; left:50%; transform:translate(-50%,-50%); }
  .cesium-viewer-bottom { opacity:.75; }
</style>
</head>
<body>
<div id="globe"></div>
<div class="panel" id="head">
  <h1>GroundTwin · Earth twins on a 3D globe</h1>
  <p>Pins come from our Analog Engine (Science mode). Click a pin for its score, rank and links.</p>
  <div id="legend"></div>
  <a href="index.html#explore" target="_top">← Back to the GroundTwin site</a>
</div>
<div class="panel" id="info" hidden><button id="close" aria-label="Close">×</button><div id="info-body"></div></div>
<div class="panel" id="msg" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
<script>
'use strict';
const GROUPS = {
  moon: { label: 'Top 5 · Moon south pole', color: '#4fd1e8', trek: 'moon' },
  mars: { label: 'Top 5 · Mars', color: '#e0735a', trek: 'mars' },
  moon_reference: { label: 'Moon training reference · Arizona', color: '#f0a35e', trek: 'moon' },
  mars_reference: { label: 'Mars training reference · Utah', color: '#f0a35e', trek: 'mars' },
  mangystau: { label: 'Our site · Mangystau', color: '#6fcf97', trek: 'mars' },
};
const TREK = { moon: ['NASA Moon Trek', 'https://trek.nasa.gov/moon/'], mars: ['NASA Mars Trek', 'https://trek.nasa.gov/mars/'] };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ll = (lat, lon) => `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lon).toFixed(2)}°${lon >= 0 ? 'E' : 'W'}`;
const gearth = (lat, lon) => `https://earth.google.com/web/@${lat},${lon},800a,60000d,35y,0h,0t,0r`;
const msg = (t) => { const m = document.getElementById('msg'); m.textContent = t; m.hidden = false; };

async function load(name) {
  const r = await fetch(`data/${name}.json`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`data/${name}.json: HTTP ${r.status}`);
  return r.json();
}

function pins(sc, ex, T) {
  const out = [], label = (tk) => T.targets[tk].label;
  for (const [tk, rows] of Object.entries(sc.top)) {
    const g = tk === 'moon_south_pole' ? 'moon' : 'mars';
    rows.forEach((r, i) => { const x = ex.top[tk][i];
      out.push({ g, text: String(r.rank), name: r.region || 'Unnamed cell', lat: r.lat, lon: r.lon, target: label(tk), S: r.S, position: x.position, n: x.n_cells, top: x.top_percent, expl: x,
                 note: `0.5° cell centre, top ${r.rank} of 5 by formula` }); });
  }
  for (const c of sc.cards) {
    const xs = ex.cards[c.key];
    c.sites.forEach((s, i) => {
      const row = c.rows.length === c.sites.length ? c.rows[i] : c.rows[0], x = c.rows.length === c.sites.length ? xs[i] : xs[0];
      out.push({ g: c.key, text: c.key === 'mangystau' ? 'M' : '★', name: s.name, lat: s.lat, lon: s.lon, target: label(c.target), S: row.S, position: row.position, n: sc.n_cells, top: row.top_percent, expl: x,
                 note: `${c.rows.length === c.sites.length ? '' : `Score for ${row.place}. `}Coordinates: ${s.coord_source}` });
    });
  }
  return out;
}

function showInfo(p, label) {
  const g = GROUPS[p.g], t = TREK[g.trek];
  document.getElementById('info-body').innerHTML = `<h2>${esc(p.name)}</h2><div class="grp">${esc(g.label)} · ${ll(p.lat, p.lon)}</div>
    <div class="nums">vs <b>${esc(p.target)}</b><br>S = <b>${p.S.toFixed(2)}</b> · rank <b>#${p.position.toLocaleString('en')}</b> of ${p.n.toLocaleString('en')} land cells (top ${p.top >= 0.1 ? p.top.toFixed(1) : p.top.toFixed(3)}%)</div>
    <p>${esc(p.expl.matches)}</p><p>${esc(p.expl.differs)}</p><span class="ai">${esc(label)}</span>
    <div class="btns"><a href="${gearth(p.lat, p.lon)}" target="_blank" rel="noopener">Open in Google Earth</a><a href="${t[1]}" target="_blank" rel="noopener">Open in ${t[0]}</a></div>
    <p class="grp">${esc(p.note)}</p>`;
  document.getElementById('info').hidden = false;
}

async function main() {
  if (typeof Cesium === 'undefined') return msg('CesiumJS could not be loaded.');
  let sc, ex, T;
  try { [sc, ex, T] = await Promise.all(['showcase', 'explanations', 'targets'].map(load)); } catch (e) { return msg('Data not found: ' + e.message); }
  Cesium.Ion.defaultAccessToken = '';
  const gibs = new Cesium.UrlTemplateImageryProvider({
    url: 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg',
    tilingScheme: new Cesium.WebMercatorTilingScheme(), maximumLevel: 8, credit: 'Imagery: NASA Blue Marble via NASA EOSDIS GIBS' });
  let viewer;
  try {
    viewer = new Cesium.Viewer('globe', { baseLayer: new Cesium.ImageryLayer(gibs), baseLayerPicker: false, geocoder: false, timeline: false,
      animation: false, sceneModePicker: false, navigationHelpButton: false, infoBox: false, fullscreenButton: false, homeButton: true });
  } catch (e) { return msg('This browser cannot show the 3D globe (WebGL is needed).'); }
  viewer.scene.globe.depthTestAgainstTerrain = true;   // hide pins on the far side of the Earth
  window.gtViewer = viewer;
  viewer.scene.screenSpaceCameraController.minimumZoomDistance = 60000;   // GIBS Blue Marble tiles stop at zoom level 8
  const pb = new Cesium.PinBuilder(), byEntity = new Map(), groups = {};
  for (const p of pins(sc, ex, T)) {
    const e = viewer.entities.add({ position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat),
      billboard: { image: pb.fromText(p.text, Cesium.Color.fromCssColorString(GROUPS[p.g].color), 40).toDataURL(), verticalOrigin: Cesium.VerticalOrigin.BOTTOM },
      label: { text: p.name, font: '12px sans-serif', fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new Cesium.Cartesian2(0, -44), distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 9e6) } });
    byEntity.set(e, p); (groups[p.g] = groups[p.g] || []).push(e);
  }
  document.getElementById('legend').innerHTML = Object.entries(GROUPS).filter(([k]) => groups[k]).map(([k, g]) =>
    `<label><input type="checkbox" data-g="${k}" checked><i style="background:${g.color}"></i>${g.label} (${groups[k].length})</label>`).join('');
  document.getElementById('legend').addEventListener('change', (ev) => { const g = ev.target.dataset.g; if (g) groups[g].forEach((e) => { e.show = ev.target.checked; }); });
  viewer.selectedEntityChanged.addEventListener((e) => { const p = e && byEntity.get(e); if (p) showInfo(p, ex.label); else document.getElementById('info').hidden = true; });
  document.getElementById('close').addEventListener('click', () => { viewer.selectedEntity = undefined; });
  viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(60, 35, 2.2e7) });
}
main();
</script>
</body>
</html>
